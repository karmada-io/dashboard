{{- $name := include "karmada-dashboard.name" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init-serviceaccount
  namespace: {{ include "karmada-dashboard.namespace" . }}
  labels:
      {{- include "karmada-dashboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ $name }}-init-serviceaccount
    spec:
      restartPolicy: Never
      {{- include "karmada-dashboard.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: init-serviceaccount-job
        image: {{ template "karmada-dashboard.kubectl.image" . }}
        imagePullPolicy: {{ .Values.kubectl.image.pullPolicy }}
        command: [ "/bin/bash", "-c" ]
        args:
          - |
            kubectl --kubeconfig=/etc/kubeconfig/kubeconfig apply -f /etc/config
        volumeMounts:
          - name: kubeconfig-secret
            subPath: kubeconfig
            mountPath: /etc/kubeconfig/kubeconfig
          - name: serviceaccount-configmap
            subPath: serviceaccount
            mountPath: /etc/config
      volumes:
        - name: kubeconfig-secret
          secret:
            secretName: {{ .Values.api.kubeconfigName }}
        - name: serviceaccount-configmap
          configMap:
            name: {{ $name }}-serviceaccount-configmap
